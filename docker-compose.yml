services:
  postgres:
    image: postgres:16-alpine
    container_name: collab-editor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collab_editor_dev
      POSTGRES_HOST_AUTH_METHOD: trust  # ⭐ FORCE TRUST SEMUA
    ports:
      - "5432:5432"
    volumes:
      - collab_editor_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  collab_editor_pg_data: